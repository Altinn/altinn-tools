name: Auto Assign to Project

on:
  issues:
    types:
      - opened

jobs:
  add-to-project:
    name: Add issue to Team Platform project
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@cea7931c6e5a8492f8d26ad2d485b18bd1c95712 # main
        with:
          project-url: https://github.com/orgs/Altinn/projects/20
          github-token: ${{ secrets.ASSIGN_PROJECT_TOKEN }}